name: Deploy and Test
on:
  push:
    branches: [main, 'issue-*']  # mainに加え、issue-xxxブランチへのpushでも起動
  workflow_dispatch:
    inputs:
      branch:
        description: 'デプロイ対象のブランチ名（空欄ならmain）'
        required: false
        default: 'main'

concurrency:
  group: deploy-${{ github.event.inputs.branch || github.ref_name }}  # ブランチ単位で直列化。mainとissue-45など別ブランチは互いにブロックしない
  cancel-in-progress: false  # 実行中のデプロイ・テストは最後まで完了させる

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.set_url.outputs.base_url }}
    steps:
      - name: 対象ブランチを決定
        id: branch
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH（mainブランチ）
        if: steps.branch.outputs.branch == 'main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/html
            git pull origin main

      - name: Deploy via SSH（issueブランチ）
        if: steps.branch.outputs.branch != 'main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            BRANCH="${{ steps.branch.outputs.branch }}"
            mkdir -p /var/www/html/branches
            cd /var/www/html/branches
            if [ -d "$BRANCH" ]; then
              cd "$BRANCH"
              git fetch origin "$BRANCH"
              git checkout "$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              git clone --branch "$BRANCH" --single-branch https://github.com/haruimai23/intro_git.git "$BRANCH"
            fi

      - name: BASE_URLを決定
        id: set_url
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          if [ "$BRANCH" = "main" ]; then
            echo "base_url=http://160.16.230.177" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=http://160.16.230.177/branches/$BRANCH" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Playwright
        run: npm install -D @playwright/test
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --reporter=html
        env:
          BASE_URL: ${{ needs.deploy.outputs.base_url }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
