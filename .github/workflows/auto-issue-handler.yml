name: Auto Issue Handler
on:
  issues:
    types: [opened]          # Issue登録で即起動
  schedule:
    - cron: '*/15 * * * *'   # 取りこぼし救済用
  workflow_dispatch:

# 並列実行の制御：
# - Issue登録で起動した実行は Issue番号ごとに別グループ → 複数Issueを並列に処理する
# - 定期実行・手動実行（取りこぼし救済）は "rescue" グループで1本ずつ処理する
concurrency:
  group: auto-issue-handler-${{ github.event_name == 'issues' && format('issue-{0}', github.event.issue.number) || 'rescue' }}
  cancel-in-progress: false

jobs:
  handle-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 暴走・ハングしても最大25分で強制終了させる
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: write
    env:
      # project スコープ付きのPAT（Settings > Secrets and variables > Actions に
      # PROJECT_TOKEN という名前で登録してください）
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      # 対応中・対応済みの目印として付けるラベル（並列実行時の二重対応防止用）
      HANDLED_LABEL: claude-handled
    steps:
      - uses: actions/checkout@v4

      # 対象Issueを Claude ではなくワークフロー側で決める。
      # 並列実行時に複数の実行が同じIssueを選んでしまうのを防ぐため。
      - name: 対象Issueを決める
        id: target
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "issues" ]; then
            # Issue登録で起動した場合：登録されたIssueそのものが対象
            NUM="$EVENT_ISSUE_NUMBER"
          else
            # 定期実行・手動実行の場合：取りこぼされたIssueを1件だけ拾う
            # 条件：openで、目印ラベルが無く、完了コメント（## レビュー結果）も無く、
            #       登録から10分以上経過しているもの（登録直後の即時実行と重ならないように）
            NUM=$(gh issue list --state open --limit 100 \
              --json number,createdAt,labels,comments \
              --jq '[ .[]
                      | select((.labels | map(.name) | index(env.HANDLED_LABEL)) | not)
                      | select(([.comments[].body | contains("## レビュー結果")] | any) | not)
                      | select((now - (.createdAt | fromdateiso8601)) > 600)
                    ]
                    | sort_by(.createdAt) | .[0].number // "none"')
          fi
          # 数字以外は受け付けない
          [[ "$NUM" =~ ^[0-9]+$ ]] || NUM="none"
          echo "対象Issue番号: $NUM"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      # 目印ラベルを付ける（以降、救済用の定期実行がこのIssueを拾わなくなる）
      - name: 対応中ラベルを付ける
        if: steps.target.outputs.number != 'none'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          gh label create "$HANDLED_LABEL" --color 5319E7 \
            --description "Claudeが対応中または対応済み" --force
          gh issue edit "$ISSUE_NUMBER" --add-label "$HANDLED_LABEL"

      - uses: anthropics/claude-code-action@v1
        if: steps.target.outputs.number != 'none'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh:*)",
                  "Bash(git:*)",
                  "Write",
                  "Edit"
                ]
              }
            }
          prompt: |
            以下の手順を実行してください：

            1. 今回の対象は Issue #${{ steps.target.outputs.number }} の1件のみである。
               gh issue view ${{ steps.target.outputs.number }} --json number,title,body
               で内容を確認する。
               他のIssueには一切手を付けないこと（他のIssueは別の実行が並列に
               処理している可能性があるため）。

            2. 対象が「プログラムを新規作成する依頼」または
               「既存プログラムの修正・不具合対応を依頼する内容」でなければ、
               何もせず終了する（正常終了とする）。

               ※プロジェクトのStatus更新は、このワークフローの後続の
               独立したステップが、作業用ブランチ名（issue-<番号>）から
               Issue番号を読み取って別途行うため、ここでは一切行わない。

            3. 作業用ブランチを作成する：
               - ブランチ名は「issue-${{ steps.target.outputs.number }}」とする。
                 スラッシュを含む名前にはしないこと。
               - git checkout -b issue-${{ steps.target.outputs.number }} main
                 で、mainから新しいブランチを作成する。
               - 以降の作業（ファイル作成・修正）は、すべてこのブランチ上で行うこと。
                 mainブランチには一切変更を加えないこと。

            4. 対象Issueへの実際の対応を行う：
               - 新規作成の場合：プログラムファイルを作成する
               - 修正の場合：対象のプログラムファイルを特定し、Issueの内容に沿って修正する
               - テスト仕様書（test_xxx.md）を作成または更新する
                 （既存のテスト仕様書がある場合は、修正内容に応じて更新する）
               - テスト仕様書をもとにPlaywrightのテストファイル（test_xxx.spec.ts）を
                 作成または更新する（既存のテストファイルがあれば、それを更新する）
                 ※このテストファイルの実行は、このワークフロー内では行わない。
                 ブランチpush後、別のワークフロー（Deploy and Test）が自動的に
                 ブランチ内容をデプロイした上でテストを実行する。
               - テストファイル内の各テストケースについて、主要な操作（初期表示直後、
                 ボタン押下後、状態変化後など）のタイミングでpage.screenshot()を用いて
                 スクリーンショットを保存すること
               - スクリーンショットの保存先はscreenshots/test_xxx/ ディレクトリとし、
                 ファイル名は連番と内容が分かる名前（例: 01_initial_view.png）とすること
               - fullPage: true を指定してページ全体をキャプチャすること
               - git add, commit し、
                 git push origin issue-${{ steps.target.outputs.number }}
                 で、作業用ブランチにPUSHする（mainにはpushしないこと）。
               - push後も、作業用ブランチから他のブランチへ
                 切り替えないこと（git checkout main 等を実行しないこと）。
                 後続のステップが、現在のブランチ名からIssue番号を読み取るため。

            4.5. 作成・修正したコードについて、セルフレビューを行うこと。
               以下の観点で確認し、その結果を手順5の完了コメントに記載する：
               - 可読性（変数名・関数名が内容を表しているか、コメントは
                 適切か）
               - 既存コードとの一貫性（命名規則・インデント・スタイルが
                 CLAUDE.mdや既存ファイルと揃っているか）
               - 潜在的な不具合（境界値の処理漏れ、エラーハンドリングの
                 不足、意図しない副作用がないか）
               - Issueの要求を過不足なく満たしているか（関係ない箇所まで
                 変更していないか）
               重大な懸念点があれば具体的に指摘すること。軽微な点は
               「改善の余地」として簡潔に触れる程度でよい。特に問題が
               見当たらない場合は、その旨を明記すること（「特に懸念事項は
               ありません」等）。指摘内容を誇張したり、逆に問題を
               見つけたふりをして無理に指摘を作り出したりしないこと。

            5. gh issue comment でIssueに完了コメントを投稿する。コメントには
               以下を含めること：
               - 対応内容の概要
               - push先のブランチ名（issue-${{ steps.target.outputs.number }}）
               - ブランチの内容は「Deploy and Test」ワークフローが自動的に
                 デプロイ・テストすること、進捗はActions画面で確認できる旨
               - 検証用URL（例: http://160.16.230.177/branches/issue-${{ steps.target.outputs.number }}/
                 対象ファイル名）
               - 「## レビュー結果」という見出しを設け、手順4.5で行った
                 セルフレビューの内容をその下に記載すること
               - プロジェクトのStatus更新については触れなくてよい
                 （このワークフローの後続のステップが別途、更新結果を
                 コメントとして追加する）
               - Issueのcloseは行わないこと。対応が完了しても
                 Issueはopenのままにしておくこと。
                 最終確認・動作検証・mainへの反映（マージ）は人間が行うため、
                 gh issue close やmainブランチへのマージは絶対に実行しないこと。

      # claude-code-action の内部では PROJECT_TOKEN が正しく使われず、
      # gh project list が常に0件を返す問題があったため、プロジェクトの
      # Status更新は claude-code-action の外側の、この独立したステップで
      # 確実に PROJECT_TOKEN を使って行う。
      #
      # 作業用ブランチ（issue-<番号>）が作られている場合だけ更新する
      # （Claudeが「プログラム作成・修正の依頼ではない」と判断した場合は更新しない）。
      - name: 対象Issue番号を読み取る
        id: target_issue
        if: always()
        env:
          EXPECTED: ${{ steps.target.outputs.number }}
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
          echo "現在のブランチ: $BRANCH"
          if [[ "$BRANCH" =~ ^issue-([0-9]+)$ ]] && [ "${BASH_REMATCH[1]}" = "$EXPECTED" ]; then
            NUM="${BASH_REMATCH[1]}"
          else
            NUM="none"
          fi
          echo "対象Issue番号: $NUM"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: プロジェクトのStatusをIn Progressに更新する
        if: always() && steps.target_issue.outputs.number != 'none' && steps.target_issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ steps.target_issue.outputs.number }}
          OWNER: haruimai23
          # プロジェクト番号（URL github.com/users/haruimai23/projects/3 の末尾）
          # タイトル（@haruimai23's project_1）で探すと表記ゆれに弱いため番号で指定する
          PROJECT_NUMBER: "3"
          PROJECT_TITLE: project_1
        run: |
          set -e

          echo "対象Issue番号: $ISSUE_NUMBER"

          PROJECT_ID=$(gh project view "$PROJECT_NUMBER" --owner "$OWNER" --format json --jq '.id' 2>&1) || PROJECT_ID=""

          if [ -z "$PROJECT_ID" ] || [[ "$PROJECT_ID" != PVT_* ]]; then
            echo "プロジェクト（番号 $PROJECT_NUMBER）が取得できませんでした: $PROJECT_ID"
            gh issue comment "$ISSUE_NUMBER" --body "## プロジェクトStatus更新について
          $PROJECT_TITLE（プロジェクト番号 $PROJECT_NUMBER）を取得できなかったため、Statusの更新はスキップしました。PROJECT_TOKENの権限（project スコープ）をご確認ください。"
            exit 0
          fi

          echo "project番号: $PROJECT_NUMBER / projectID: $PROJECT_ID"

          ITEM_JSON=$(gh project item-list "$PROJECT_NUMBER" --owner "$OWNER" --format json --limit 200)
          ITEM_ID=$(echo "$ITEM_JSON" | jq -r --arg n "$ISSUE_NUMBER" '.items[] | select(.content.number == ($n|tonumber)) | .id' | head -n1)

          if [ -z "$ITEM_ID" ]; then
            echo "対象Issueに対応するプロジェクトアイテムが見つかりませんでした。"
            gh issue comment "$ISSUE_NUMBER" --body "## プロジェクトStatus更新について
          このIssueはプロジェクト（$PROJECT_TITLE）に紐づいていなかったため、Statusの更新はスキップしました。"
            exit 0
          fi

          echo "アイテムID: $ITEM_ID"

          FIELD_JSON=$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json)
          FIELD_ID=$(echo "$FIELD_JSON" | jq -r '.fields[] | select(.name == "Status") | .id')
          OPTION_ID=$(echo "$FIELD_JSON" | jq -r '.fields[] | select(.name == "Status") | .options[] | select(.name == "In Progress") | .id')

          if [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "StatusフィールドまたはIn Progressオプションが見つかりませんでした。"
            gh issue comment "$ISSUE_NUMBER" --body "## プロジェクトStatus更新について
          StatusフィールドまたはIn Progressオプションが見つからなかったため、Statusの更新に失敗しました。"
            exit 0
          fi

          if gh project item-edit --id "$ITEM_ID" --field-id "$FIELD_ID" --project-id "$PROJECT_ID" --single-select-option-id "$OPTION_ID"; then
            echo "Statusの更新に成功しました。"
            gh issue comment "$ISSUE_NUMBER" --body "## プロジェクトStatus更新について
          $PROJECT_TITLE のStatusを「In Progress」に更新しました。"
          else
            echo "Statusの更新に失敗しました。"
            gh issue comment "$ISSUE_NUMBER" --body "## プロジェクトStatus更新について
          Statusの更新コマンド（gh project item-edit）の実行に失敗しました。PROJECT_TOKENの権限（project スコープ）をご確認ください。"
          fi
