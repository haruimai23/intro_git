name: Auto Issue Handler
on:
  schedule:
    - cron: '*/10 * * * *'  # 10分おきに実行
  workflow_dispatch:

concurrency:
  group: auto-issue-handler
  cancel-in-progress: false

jobs:
  handle-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh:*)",
                  "Bash(git:*)",
                  "Write",
                  "Edit"
                ]
              }
            }
          prompt: |
            以下の手順を実行してください：
            1. gh issue list --state open でIssue一覧を取得する
            2. 各Issueの内容を確認し「プログラムを作成」という内容であれば：
               - プログラムファイルを作成する
               - テスト仕様書（test_xxx.md）を作成する
               - テスト仕様書をもとにPlaywrightのテストファイル（test_xxx.spec.ts）を作成する
               - BASE_URLはhttp://160.16.230.177を使用する
               - テストファイル内の各テストケースについて、主要な操作（初期表示直後、
                 ボタン押下後、状態変化後など）のタイミングでpage.screenshot()を用いて
                 スクリーンショットを保存すること
               - スクリーンショットの保存先はscreenshots/test_xxx/ ディレクトリとし、
                 ファイル名は連番と内容が分かる名前（例: 01_initial_view.png）とすること
               - fullPage: true を指定してページ全体をキャプチャすること
               - git add, commit, push でmainブランチにPUSHする
               - gh issue comment でIssueに完了コメントを投稿する
               - gh issue close でIssueをcloseする
            3. 対応完了（close済み）のIssueはスキップする

      - name: Trigger deploy workflow
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
