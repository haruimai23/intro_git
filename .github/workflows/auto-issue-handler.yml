name: Auto Issue Handler
on:
  issues:
    types: [opened]          # Issue登録で即起動
  schedule:
    - cron: '*/15 * * * *'   # 取りこぼし救済用（30分→15分に短縮）
  workflow_dispatch:

concurrency:
  group: auto-issue-handler
  cancel-in-progress: false

jobs:
  handle-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 暴走・ハングしても最大25分で強制終了させる
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: write
    env:
      # project スコープ付きのPAT（Settings > Secrets and variables > Actions に
      # PROJECT_TOKEN という名前で登録してください）
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(gh:*)",
                  "Bash(git:*)",
                  "Write",
                  "Edit"
                ]
              }
            }
          prompt: |
            以下の手順を実行してください：

            1. gh issue list --state open --json number,title,body,createdAt
               でIssue一覧を取得する

            2. 取得したIssueの中から、Statusが未着手（Todo等。「In Progress」
               または「Done」ではなく、かつ既に完了コメントも投稿されていない）
               のものだけを対象に、createdAt（作成日時）が古い順に並べ替える。

            3. 並べ替えた結果の**先頭の1件（最も古い未着手Issue）だけ**を
               今回の対象とする。対象が「プログラムを新規作成する依頼」または
               「既存プログラムの修正・不具合対応を依頼する内容」でなければ、
               何もせず終了する（対象IssueがなければそこでOK、正常終了とする）。

               ※1回の実行につき処理するIssueは必ず1件のみとすること。
               複数のIssueをまとめて処理しようとしないこと。これは、
               1回の実行時間を短く保ち、後続のIssueがキューに埋もれて
               いつまでも処理されない事態を防ぐための重要な制約である。

            4. 対応を開始する前に、そのIssueが紐づいているプロジェクト
               （@haruimai23's project_1）のStatusフィールドを
               「In Progress」に変更すること。判定・更新は必ず以下の
               具体的な手順で行い、途中で「見つからない」場合でも
               安易に「紐づいていない」と判断せず、必ずlimitを
               十分大きく指定して再確認すること：

               a. gh issue view <issue番号> --json id,number,title
                  で対象Issueの内容を確認する

               b. gh project list --owner haruimai23 --format json --limit 100
                  で「project_1」というタイトルを含むプロジェクトを探し、
                  そのプロジェクトのnumberとidを取得する
                  （タイトルに「project_1」という文字列を含むものを対象とする）

               c. gh project item-list <bで取得したproject番号> --owner haruimai23
                  --format json --limit 200
                  のように、必ず --limit 200 以上を指定して全アイテムを取得し、
                  その中から content.number が対象Issueの番号と一致する
                  アイテムを探し、そのアイテムのidを取得する。
                  --limit を指定せずに実行した場合、デフォルトの取得件数制限により
                  最近追加されたIssueが結果に含まれず、誤って「紐づいていない」と
                  判断してしまうことがあるため、必ず --limit 200 以上を指定すること。

               d. cで対象アイテムが見つかった場合：
                  gh project field-list <project番号> --owner haruimai23 --format json
                  で「Status」という名前のフィールドのidを取得し、
                  そのフィールドのoptionsの中から名前が「In Progress」の
                  オプションのidを取得する

               e. 以下のコマンドでStatusを更新する：
                  gh project item-edit --id <cで取得したアイテムID>
                  --field-id <dで取得したStatusのフィールドID>
                  --project-id <bで取得したプロジェクトID>
                  --single-select-option-id <dで取得したIn ProgressのオプションID>

               f. cの手順で --limit 200 を指定しても対象アイテムが
                  本当に見つからなかった場合に限り、この手順をスキップし、
                  その場合は完了コメントに「このIssueはプロジェクトに
                  紐づいていなかったため、Statusの更新はスキップしました」
                  と明記すること。また、item-editコマンドの実行時にエラーが
                  出た場合は、そのエラーメッセージの内容を完了コメントに
                  そのまま含めること（権限不足なのか、IDの指定誤りなのかを
                  後で判別できるようにするため）。

            5. 作業用ブランチを作成する：
               - ブランチ名は「issue-<issue番号>」とする（例: issue-45）。
                 スラッシュを含む名前にはしないこと。
               - git checkout -b issue-<issue番号> main
                 で、mainから新しいブランチを作成する。
               - 以降の作業（ファイル作成・修正）は、すべてこのブランチ上で行うこと。
                 mainブランチには一切変更を加えないこと。

            6. 対象Issueへの実際の対応を行う：
               - 新規作成の場合：プログラムファイルを作成する
               - 修正の場合：対象のプログラムファイルを特定し、Issueの内容に沿って修正する
               - テスト仕様書（test_xxx.md）を作成または更新する
                 （既存のテスト仕様書がある場合は、修正内容に応じて更新する）
               - テスト仕様書をもとにPlaywrightのテストファイル（test_xxx.spec.ts）を
                 作成または更新する（既存のテストファイルがあれば、それを更新する）
                 ※このテストファイルの実行は、このワークフロー内では行わない。
                 ブランチpush後、別のワークフロー（Deploy and Test）が自動的に
                 ブランチ内容をデプロイした上でテストを実行する。
               - テストファイル内の各テストケースについて、主要な操作（初期表示直後、
                 ボタン押下後、状態変化後など）のタイミングでpage.screenshot()を用いて
                 スクリーンショットを保存すること
               - スクリーンショットの保存先はscreenshots/test_xxx/ ディレクトリとし、
                 ファイル名は連番と内容が分かる名前（例: 01_initial_view.png）とすること
               - fullPage: true を指定してページ全体をキャプチャすること
               - git add, commit し、
                 git push origin issue-<issue番号>
                 で、作業用ブランチにPUSHする（mainにはpushしないこと）。

            7. gh issue comment でIssueに完了コメントを投稿する。コメントには
               以下を含めること：
               - 対応内容の概要
               - push先のブランチ名（issue-<issue番号>）
               - ブランチの内容は「Deploy and Test」ワークフローが自動的に
                 デプロイ・テストすること、進捗はActions画面で確認できる旨
               - 検証用URL（例: http://160.16.230.177/branches/issue-<issue番号>/
                 対象ファイル名）
               - Issueのcloseは行わないこと。対応が完了しても
                 Issueはopenのまま、Statusは「In Progress」の状態で止めておくこと。
                 最終確認・動作検証・mainへの反映（マージ）は人間が行うため、
                 gh issue close やmainブランチへのマージは絶対に実行しないこと。

            8. Statusが既に「In Progress」または「Done」になっているIssue、
               あるいは既に完了コメントを投稿済みのIssueは、二重対応を避けるため
               対象から除外する（手順2の絞り込みに含める）。
