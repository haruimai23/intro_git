<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テトリス Next10</title>
<style>
  body {
    background: #1e1e2e;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 24px;
    padding: 24px;
  }
  h1 {
    text-align: center;
    font-size: 20px;
  }
  canvas#board {
    background: #111;
    border: 4px solid #555;
    display: block;
  }
  canvas#next {
    background: #111;
    border: 4px solid #555;
    display: block;
    margin-top: 8px;
  }
  canvas.next-mini {
    background: #111;
    border: 3px solid #444;
    display: block;
    margin-top: 6px;
  }
  canvas#hold {
    background: #111;
    border: 3px solid #444;
    display: block;
    margin-top: 6px;
  }
  .panel {
    width: 160px;
  }
  .info {
    background: #2a2a3a;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .info div {
    margin: 4px 0;
  }
  div#message {
    font-weight: bold;
    color: #ff6b6b;
    min-height: 24px;
  }
  div#tspinMessage {
    font-weight: bold;
    color: #ffd93d;
    min-height: 20px;
    font-size: 13px;
  }
  div#pcMessage {
    font-weight: bold;
    color: #6bffb8;
    min-height: 20px;
    font-size: 13px;
  }
  div#b2bMessage {
    font-weight: bold;
    color: #4dd0ff;
    min-height: 20px;
    font-size: 13px;
  }
  button {
    width: 100%;
    padding: 8px;
    margin-top: 8px;
    cursor: pointer;
  }
  .controls {
    font-size: 12px;
    line-height: 1.6;
    color: #aaa;
  }
</style>
</head>
<body>

<div>
  <h1>テトリス Next10</h1>
  <canvas id="board" width="240" height="480"></canvas>
</div>

<div class="panel">
  <div class="info">
    <div>スコア: <span id="score">0</span></div>
    <div>ハイスコア: <span id="highScore">0</span></div>
    <div>ライン: <span id="lines">0</span></div>
    <div>レベル: <span id="level">1</span></div>
    <div>コンボ: <span id="combo">0</span></div>
    <div>ピース数: <span id="pieces">0</span></div>
    <div>T-Spin数: <span id="tspins">0</span></div>
    <div>全消し数: <span id="pcs">0</span></div>
    <div>B2B: <span id="b2b">0</span></div>
  </div>
  <div>HOLD</div>
  <canvas id="hold" width="80" height="80"></canvas>
  <div>NEXT</div>
  <canvas id="next" width="120" height="120"></canvas>
  <canvas id="next2" class="next-mini" width="80" height="80"></canvas>
  <canvas id="next3" class="next-mini" width="80" height="80"></canvas>
  <div id="message"></div>
  <div id="tspinMessage"></div>
  <div id="pcMessage"></div>
  <div id="b2bMessage"></div>
  <button id="startBtn">スタート / 再スタート</button>
  <button id="pauseBtn">一時停止</button>
  <button id="ghostBtn">ゴースト: ON</button>
  <button id="resetHighScoreBtn">ハイスコアをリセット</button>
  <div class="controls">
    <p>← → : 移動<br>
    ↑ : 回転<br>
    ↓ : ソフトドロップ<br>
    スペース : ハードドロップ<br>
    P : 一時停止<br>
    C または Shift : ホールド</p>
  </div>

<script>
(function () {
  const COLS = 10;
  const ROWS = 20;
  const BLOCK = 24;
  const QUEUE_SIZE = 3;
  const HIGH_SCORE_KEY = "tetrisNext10HighScore";

  const boardCanvas = document.getElementById("board");
  const ctx = boardCanvas.getContext("2d");
  const nextCanvas = document.getElementById("next");
  const nextCtx = nextCanvas.getContext("2d");
  const next2Canvas = document.getElementById("next2");
  const next2Ctx = next2Canvas.getContext("2d");
  const next3Canvas = document.getElementById("next3");
  const next3Ctx = next3Canvas.getContext("2d");
  const holdCanvas = document.getElementById("hold");
  const holdCtx = holdCanvas.getContext("2d");

  const scoreEl = document.getElementById("score");
  const highScoreEl = document.getElementById("highScore");
  const linesEl = document.getElementById("lines");
  const levelEl = document.getElementById("level");
  const comboEl = document.getElementById("combo");
  const piecesEl = document.getElementById("pieces");
  const tspinsEl = document.getElementById("tspins");
  const pcsEl = document.getElementById("pcs");
  const b2bEl = document.getElementById("b2b");
  const messageEl = document.getElementById("message");
  const tspinMessageEl = document.getElementById("tspinMessage");
  const pcMessageEl = document.getElementById("pcMessage");
  const b2bMessageEl = document.getElementById("b2bMessage");
  const startBtn = document.getElementById("startBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const ghostBtn = document.getElementById("ghostBtn");
  const resetHighScoreBtn = document.getElementById("resetHighScoreBtn");
  const COLORS = {};
  COLORS.I = "#00f0f0";
  COLORS.O = "#f0f000";
  COLORS.T = "#a000f0";
  COLORS.S = "#00f000";
  COLORS.Z = "#f00000";
  COLORS.J = "#0000f0";
  COLORS.L = "#f0a000";
  const SHAPES = {
    I: [
      [0, 1], [1, 1], [2, 1], [3, 1]
    ],
    O: [
      [0, 0], [1, 0], [0, 1], [1, 1]
    ],
    T: [
      [0, 1], [1, 1], [2, 1], [1, 0]
    ],
    S: [
      [1, 0], [2, 0], [0, 1], [1, 1]
    ],
    Z: [
      [0, 0], [1, 0], [1, 1], [2, 1]
    ],
    J: [
      [0, 0], [0, 1], [1, 1], [2, 1]
    ],
    L: [
      [2, 0], [0, 1], [1, 1], [2, 1]
    ]
  };
  const PIECE_TYPES = Object.keys(SHAPES);

  let board = createEmptyBoard();
  let current = null;
  let queue = [];
  let bag = [];
  let score = 0;
  let highScore = loadHighScore();
  let lines = 0;
  let level = 1;
  let combo = 0;
  let piecesCount = 0;
  let tspinCount = 0;
  let perfectClearCount = 0;
  let b2bCount = 0;
  let lastClearWasDifficult = false;
  let lastMoveWasRotation = false;
  let dropInterval = 1000;
  let dropTimer = null;
  let paused = false;
  let gameOver = false;
  let running = false;
  let holdType = null;
  let holdUsed = false;
  let ghostEnabled = true;
  function createEmptyBoard() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  function loadHighScore() {
    const stored = Number(localStorage.getItem(HIGH_SCORE_KEY));
    return Number.isFinite(stored) && stored > 0 ? stored : 0;
  }

  function saveHighScore() {
    localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function nextFromBag() {
    if (bag.length === 0) {
      bag = shuffle(PIECE_TYPES.slice());
    }
    return bag.shift();
  }

  function makePiece(type) {
    return {
      type: type,
      cells: SHAPES[type].map(([x, y]) => ({ x: x, y: y })),
      x: 3,
      y: 0
    };
  }

  function refillQueue() {
    while (queue.length < QUEUE_SIZE) {
      queue.push(nextFromBag());
    }
  }

  function rotateCells(cells) {
    const maxX = Math.max(...cells.map(c => c.x));
    return cells.map(({ x, y }) => ({ x: maxX - y, y: x }));
  }

  function absoluteCells(piece) {
    return piece.cells.map(c => ({ x: c.x + piece.x, y: c.y + piece.y }));
  }

  function collides(cells) {
    for (const { x, y } of cells) {
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && board[y][x]) return true;
    }
    return false;
  }

  function mergePiece() {
    for (const { x, y } of absoluteCells(current)) {
      if (y >= 0) board[y][x] = current.type;
    }
  }

  function isTSpin() {
    if (!current || current.type !== "T" || !lastMoveWasRotation) return false;
    const cx = current.x + 1;
    const cy = current.y + 1;
    const corners = [
      { x: cx - 1, y: cy - 1 },
      { x: cx + 1, y: cy - 1 },
      { x: cx - 1, y: cy + 1 },
      { x: cx + 1, y: cy + 1 }
    ];
    let occupied = 0;
    for (const { x, y } of corners) {
      if (x < 0 || x >= COLS || y >= ROWS || (y >= 0 && board[y][x])) {
        occupied++;
      }
    }
    return occupied >= 3;
  }

  function isBoardEmpty() {
    return board.every(row => row.every(cell => !cell));
  }

  function clearLines() {
    const tspin = isTSpin();
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (board[y].every(cell => cell)) {
        board.splice(y, 1);
        board.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    const isDifficult = cleared > 0 && (tspin || cleared === 4);
    let b2bActive = false;
    if (cleared > 0) {
      if (isDifficult) {
        b2bActive = lastClearWasDifficult;
        if (b2bActive) b2bCount += 1;
        lastClearWasDifficult = true;
      } else {
        lastClearWasDifficult = false;
      }
    }
    if (tspin) {
      tspinCount += 1;
      const tspinPoints = [400, 800, 1200, 1600][cleared] || 400;
      let tspinScore = tspinPoints * level;
      if (b2bActive) tspinScore = Math.floor(tspinScore * 1.5);
      score += tspinScore;
      tspinMessageEl.textContent = cleared > 0 ? "T-Spin!" : "T-Spin (No Lines)";
    } else {
      tspinMessageEl.textContent = "";
    }
    if (cleared > 0) {
      combo += 1;
      const points = [0, 100, 300, 500, 800][cleared] || 800;
      let lineScore = points * level + (combo - 1) * 50 * level;
      if (isDifficult && b2bActive) lineScore = Math.floor(lineScore * 1.5);
      score += lineScore;
      lines += cleared;
      level = Math.floor(lines / 10) + 1;
      dropInterval = Math.max(100, 1000 - (level - 1) * 100);
      if (isBoardEmpty()) {
        perfectClearCount += 1;
        score += 2000 * level;
        pcMessageEl.textContent = "Perfect Clear!";
      } else {
        pcMessageEl.textContent = "";
      }
      b2bMessageEl.textContent = b2bActive ? "Back-to-Back!" : "";
    } else {
      combo = 0;
      pcMessageEl.textContent = "";
      b2bMessageEl.textContent = "";
    }
    updateInfo();
  }

  function updateInfo() {
    scoreEl.textContent = score;
    if (score > highScore) {
      highScore = score;
      saveHighScore();
    }
    highScoreEl.textContent = highScore;
    linesEl.textContent = lines;
    comboEl.textContent = combo;
    piecesEl.textContent = piecesCount;
    tspinsEl.textContent = tspinCount;
    pcsEl.textContent = perfectClearCount;
    b2bEl.textContent = b2bCount;
    const prevLevel = levelEl.textContent;
    levelEl.textContent = level;
    if (String(level) !== prevLevel) {
      resetTimer();
    }
  }

  function spawnPiece() {
    const type = queue.shift();
    current = makePiece(type);
    current.x = 3;
    current.y = 0;
    lastMoveWasRotation = false;
    refillQueue();
    holdUsed = false;
    piecesCount += 1;
    updateInfo();
    if (collides(absoluteCells(current))) {
      endGame();
    }
    drawNextQueue();
  }
  function endGame() {
    gameOver = true;
    running = false;
    clearInterval(dropTimer);
    messageEl.textContent = "ゲームオーバー";
  }
  function move(dx, dy) {
    if (!current || paused || gameOver) return false;
    const movedX = current.x + dx;
    const movedY = current.y + dy;
    const cells = current.cells.map(c => ({ x: c.x + movedX, y: c.y + movedY }));
    if (collides(cells)) return false;
    current.x = movedX;
    current.y = movedY;
    lastMoveWasRotation = false;
    return true;
  }

  function rotate() {
    if (!current || paused || gameOver) return;
    const rotated = rotateCells(current.cells);
    const cells = rotated.map(c => ({ x: c.x + current.x, y: c.y + current.y }));
    if (!collides(cells)) {
      current.cells = rotated;
      lastMoveWasRotation = true;
      return;
    }
    for (const kick of [-1, 1, -2, 2]) {
      const kicked = cells.map(c => ({ x: c.x + kick, y: c.y }));
      if (!collides(kicked)) {
        current.cells = rotated;
        current.x += kick;
        lastMoveWasRotation = true;
        return;
      }
    }
  }

  function softDrop() {
    if (!move(0, 1)) {
      lockPiece();
    } else {
      score += 1;
      updateInfo();
    }
  }

  function hardDrop() {
    if (!current || paused || gameOver) return;
    let dropped = 0;
    while (move(0, 1)) dropped++;
    score += dropped * 2;
    updateInfo();
    lockPiece();
  }

  function holdPiece() {
    if (!current || paused || gameOver || holdUsed) return;
    holdUsed = true;
    const currentType = current.type;
    if (holdType === null) {
      holdType = currentType;
      spawnPiece();
    } else {
      const swapped = makePiece(holdType);
      holdType = currentType;
      current = swapped;
      current.x = 3;
      current.y = 0;
      lastMoveWasRotation = false;
      if (collides(absoluteCells(current))) {
        endGame();
      }
    }
    drawHold();
    draw();
  }

  function lockPiece() {
    mergePiece();
    clearLines();
    if (!gameOver) spawnPiece();
    draw();
  }

  function tick() {
    if (paused || gameOver) return;
    if (!move(0, 1)) {
      lockPiece();
    }
    draw();
  }

  function ghostCells() {
    if (!current) return [];
    let dy = 0;
    while (true) {
      const cells = current.cells.map(c => ({ x: c.x + current.x, y: c.y + current.y + dy + 1 }));
      if (collides(cells)) break;
      dy++;
    }
    return current.cells.map(c => ({ x: c.x + current.x, y: c.y + current.y + dy }));
  }

  function draw() {
    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (board[y][x]) {
          drawBlock(ctx, x, y, COLORS[board[y][x]]);
        }
      }
    }
    if (current && ghostEnabled && !paused && !gameOver) {
      for (const { x, y } of ghostCells()) {
        if (y >= 0) drawGhostBlock(ctx, x, y, COLORS[current.type]);
      }
    }
    if (current) {
      for (const { x, y } of absoluteCells(current)) {
        if (y >= 0) drawBlock(ctx, x, y, COLORS[current.type]);
      }
    }
  }
  function drawBlock(context, x, y, color) {
    context.fillStyle = color;
    context.fillRect(x * BLOCK, y * BLOCK, BLOCK - 1, BLOCK - 1);
    context.strokeStyle = "rgba(255,255,255,0.2)";
    context.strokeRect(x * BLOCK, y * BLOCK, BLOCK - 1, BLOCK - 1);
  }
  function drawGhostBlock(context, x, y, color) {
    context.strokeStyle = color;
    context.lineWidth = 2;
    context.strokeRect(x * BLOCK + 1, y * BLOCK + 1, BLOCK - 3, BLOCK - 3);
    context.lineWidth = 1;
  }
  function drawPiecePreview(context, canvas, type, blockSize) {
    context.clearRect(0, 0, canvas.width, canvas.height);
    if (!type) return;
    for (const [x, y] of SHAPES[type]) {
      drawBlock(context, x, y, COLORS[type]);
    }
  }
  function drawNextQueue() {
    drawPiecePreview(nextCtx, nextCanvas, queue[0]);
    drawPiecePreview(next2Ctx, next2Canvas, queue[1]);
    drawPiecePreview(next3Ctx, next3Canvas, queue[2]);
  }
  function drawHold() {
    drawPiecePreview(holdCtx, holdCanvas, holdType);
  }
  function startGame() {
    clearInterval(dropTimer);
    board = createEmptyBoard();
    score = 0;
    lines = 0;
    level = 1;
    combo = 0;
    piecesCount = 0;
    tspinCount = 0;
    perfectClearCount = 0;
    b2bCount = 0;
    lastClearWasDifficult = false;
    lastMoveWasRotation = false;
    dropInterval = 1000;
    paused = false;
    gameOver = false;
    running = true;
    holdType = null;
    holdUsed = false;
    messageEl.textContent = "";
    tspinMessageEl.textContent = "";
    pcMessageEl.textContent = "";
    b2bMessageEl.textContent = "";
    bag = [];
    queue = [];
    refillQueue();
    spawnPiece();
    updateInfo();
    drawHold();
    draw();
    resetTimer();
  }
  function resetTimer() {
    clearInterval(dropTimer);
    dropTimer = setInterval(tick, dropInterval);
  }
  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    messageEl.textContent = paused ? "一時停止中" : "";
  }
  function toggleGhost() {
    ghostEnabled = !ghostEnabled;
    ghostBtn.textContent = "ゴースト: " + (ghostEnabled ? "ON" : "OFF");
    draw();
  }
  function resetHighScore() {
    highScore = 0;
    saveHighScore();
    highScoreEl.textContent = highScore;
  }

  document.addEventListener("keydown", function (e) {
    if (!running) return;
    switch (e.key) {
      case "ArrowLeft":
        e.preventDefault();
        move(-1, 0);
        draw();
        break;
      case "ArrowRight":
        e.preventDefault();
        move(1, 0);
        draw();
        break;
      case "ArrowDown":
        e.preventDefault();
        softDrop();
        draw();
        break;
      case "ArrowUp":
        e.preventDefault();
        rotate();
        draw();
        break;
      case " ":
        e.preventDefault();
        hardDrop();
        break;
      case "p":
      case "P":
        e.preventDefault();
        togglePause();
        break;
      case "c":
      case "C":
      case "Shift":
        e.preventDefault();
        holdPiece();
        break;
    }
  });
  startBtn.addEventListener("click", startGame);
  pauseBtn.addEventListener("click", togglePause);
  ghostBtn.addEventListener("click", toggleGhost);
  resetHighScoreBtn.addEventListener("click", resetHighScore);
  highScoreEl.textContent = highScore;
  draw();
})();
</script>

</body>
</html>
